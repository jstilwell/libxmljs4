name: builds

on:
  push:
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            windows-2025,
            windows-11-arm,
            macos-15,
            ubuntu-22.04,
            ubuntu-22.04-arm,
          ]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Node 25 and later no longer bundle corepack. --force lets it replace
      # the yarn/pnpm shims preinstalled on Windows runners (EEXIST
      # otherwise), which `corepack enable` below would take over anyway.
      - if: matrix.node >= 26
        run: npm install -g corepack@0.36.0 --force
      - run: corepack enable
      - run: pnpm i --frozen-lockfile
        env:
          npm_config_build_from_source: true
      - run: pnpm build:ts
      - run: pnpm tsd
      - run: pnpm test
  prebuild:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            windows-2025,
            windows-11-arm,
            macos-15,
            ubuntu-22.04,
            ubuntu-22.04-arm,
          ]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm i --frozen-lockfile
        env:
          npm_config_build_from_source: true
      - run: pnpm prebuild
      - run: pnpm build:ts
      # Load the binary just built. With build/ removed, node-gyp-build can
      # only resolve it from prebuilds/. Every runner in this matrix builds
      # for its own architecture (none cross-compile), so each prebuild can
      # be loaded where it was built. One command per step: a multi-line
      # PowerShell step only fails on the last command's exit code.
      - run: |
          node -e "require('fs').rmSync('build', { recursive: true, force: true })"
      - run: |
          node -e "console.log(require('node-gyp-build').path('.'))"
      - run: |
          node -e "const l=require('./index.js'); if (l.parseXml('<a/>').root().name()!=='a') process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.os }}-prebuild
          path: "prebuilds/"
  alpine:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        node: [22, 24]
      fail-fast: true
    container:
      image: node:${{ matrix.node }}-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          apk add --no-cache python3 make g++
      - run: corepack enable
      - run: pnpm i --frozen-lockfile
        env:
          npm_config_build_from_source: true
      - run: pnpm build:ts
      - run: pnpm tsd
      - run: pnpm test
      - run: pnpm prebuild
      # Load the musl prebuild just built, as in the prebuild job above.
      - run: |
          node -e "require('fs').rmSync('build', { recursive: true, force: true })"
      - run: |
          node -e "console.log(require('node-gyp-build').path('.'))"
      - run: |
          node -e "const l=require('./index.js'); if (l.parseXml('<a/>').root().name()!=='a') process.exit(1)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == 24
        with:
          name: alpine-prebuild
          path: "prebuilds/"
  deploy:
    runs-on: ubuntu-latest
    needs: [alpine, prebuild, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: prebuilds
          pattern: "*-prebuild"
          merge-multiple: true
      - run: find prebuilds -type f | head -50
      # Every platform's binary is named libxmljs4.node and is distinguished
      # only by its parent directory, so uploading them as individual release
      # assets flattens them into a single name and they overwrite each other.
      # Ship one tarball that preserves the directory structure instead; it is
      # what `pnpm publish` needs to unpack into prebuilds/ before publishing.
      - name: Check every expected platform is present
        run: |
          set -euo pipefail
          missing=0
          for p in darwin-arm64 linux-x64 linux-arm64 win32-x64 win32-arm64; do
            if [ -z "$(find "prebuilds/$p" -name '*.node' -print -quit 2>/dev/null)" ]; then
              echo "MISSING: prebuilds/$p"
              missing=1
            fi
          done
          # Alpine builds into linux-x64 alongside the glibc build, so assert
          # the musl-tagged file specifically rather than just the directory.
          if [ -z "$(find prebuilds -name '*.musl.node' -print -quit)" ]; then
            echo "MISSING: any musl-tagged prebuild"
            missing=1
          fi
          exit $missing
      - name: Package prebuilds
        env:
          TAG: ${{ github.ref_name }}
        run: tar -czf "libxmljs4-prebuilds-$TAG.tar.gz" -C prebuilds .
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: libxmljs4-prebuilds-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
